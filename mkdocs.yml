site_name: Infrastructure Documentation
site_description: Technical infrastructure documentation portal
repo_name: ZaenFerdiansyah/docsnewri
repo_url: https://github.com/ZaenFerdiansyah/docsnewri
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - assets/stylesheets/secure.css

extra_javascript:
  - assets/javascripts/secure-pages.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Network:
      - Overview: network/index.md
      - MikroTik: network/mikrotik.md
      - VyOS 🔒: network/vyos.md
      - BGP: network/bgp.md
      - WireGuard: network/wireguard.md
  - DNS: dns/index.md
  - Server:
      - Overview: server/index.md
      - VMware ESXi 🔒: server/esxi.md
  - Monitoring: monitoring/index.md
  - Maintainers:
      - Documentation workflow 🔒: maintainers/documentation-workflow.md
      - Security boundaries 🔒: maintainers/security.md
